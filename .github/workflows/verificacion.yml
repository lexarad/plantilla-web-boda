name: Verificación

# Nada debería llegar a la web de la boda sin que los tipos, los tests y el
# build hayan pasado. Vercel despliega cualquier cosa que compile: esta es la
# red de seguridad que faltaba.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Lint
        run: npx next lint

      - name: Build
        run: npm run build

      - name: Navegadores para las pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium

      - name: Pruebas del camino crítico (invitado y panel)
        run: npx playwright test --project=escritorio
